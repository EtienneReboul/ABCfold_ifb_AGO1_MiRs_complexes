# ─────────────────────────────────────────────
# Complex spec — AGO1 x ATG8A x miR168 ternary complex
# = configs/ago1_atg8a.yaml (AGO1 + ATG8A) + the miR168 RNA chain from
#   configs/ago1_fbw2_mir168.yaml.
# AGO1  = ARGONAUTE 1 (Arabidopsis thaliana).
# ATG8A = Autophagy-related protein 8A (Arabidopsis thaliana),
#         UniProt Q8LEM4 (ATG8A_ARATH), locus AT4G21980.2 — ubiquitin-like
#         autophagy modifier.
# miR168 = 21-nt mature miRNA (sequence copied verbatim from
#          configs/ago1_fbw2_mir168.yaml, itself from the sibling
#          esther_project's AF3-webserver job_request.json files).
# ─────────────────────────────────────────────

name: ago1_atg8a_mir168

sequences:
  - type: protein
    id: A
    name: AGO1
    sequence: ""
  - type: protein
    id: B
    name: ATG8A
    sequence: "MIFACLKFAETNRIAMAKSSFKISNPLEARMSESSRIREKYPDRIPVIVEKAGQSDVPDIDKKKYLVPADLTVGQFVYVVRKRIKLGAEKAIFVFVKNTLPPTAALMSAIYEEHKDEDGFLYMTYSGENTFGSLTVA"
  - type: rna
    id: C
    name: miR168
    sequence: "UCGCUUGGUGCAGGUCGGGAA"

# Rigid structural anchor for pose clustering: AGO1 (the receptor).
# RNA (chain C) is excluded from the pose-clustering feature vector — mixing
# protein Ca and RNA P/C1' RMSD isn't meaningful; it still rides along in the
# minimized / PLIP structures downstream. (Same rationale as ago1_fbw2_mir168.)
anchor_chain: A
partner_chains: [B]        # ATG8A (RNA excluded — see above)

# ── PLIP (Stage 3, postprocessing) — AGO1-anchored, receptor = AGO1 vs rest ──
# "receptor = anchor (AGO1) vs. ligand = every other chain", same view as
# ago1_fbw2_mir168: the miR RNA folds into the receptor group alongside AGO1.
plip:
  dnareceptor: true
  fix_pdb: true
  chains: "[['A'], ['B', 'C']]"
  docker_memory: "8g"
  docker_platform: "linux/amd64"

# ── PLIP: miR-ligand pass (Stage 3f/g/h-alt) ─────────────────────────────────
# Direct port of esther_project/configs/mir_ligands.yaml. The main plip: block
# above folds the miR RNA into the receptor group alongside AGO1, so
# per-nucleotide miR contacts are invisible to it. This second pass omits
# --chains entirely (PLIP segfaults if an RNA chain group is listed first) and
# runs WITHOUT --dnareceptor, so every miR nucleotide is reported as its own
# SMALLMOLECULE ligand and all positions surface; downstream analysis filters
# to chain A (AGO1) as needed.
plip_mir_ligands:
  dnareceptor: false
  fix_pdb: true          # ABCfold's RNA atom naming still needs canonicalising
  chains: null            # omit --chains entirely
  docker_memory: "8g"
  docker_platform: "linux/amd64"
