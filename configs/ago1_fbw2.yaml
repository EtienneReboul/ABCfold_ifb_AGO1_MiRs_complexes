# ─────────────────────────────────────────────
# Complex spec — AGO1 x FBW2 binary complex (protein-protein only, no miR)
# Sequences copied verbatim from the sibling esther_project's AF3-webserver
# job_request.json files (../../esther_project/data/AGO1_FBW2/.../*_job_request.json).
# AGO1 = ARGONAUTE 1 (Arabidopsis thaliana), FBW2 = F-box/WD40 protein FBW2.
# ─────────────────────────────────────────────

name: ago1_fbw2

sequences:
  - type: protein
    id: A
    name: AGO1
    sequence: ""
  - type: protein
    id: B
    name: FBW2
    sequence: ""

# Rigid structural anchor for pose clustering: AGO1 (the receptor).
anchor_chain: A
partner_chains: [B]        # FBW2

# ── PLIP (Stage 3, postprocessing) — AGO1-anchored, receptor = AGO1 vs rest ──
# Mirrors esther_project/configs/AGO1_FBW2_interactions.yaml's receptor=A view,
# generalised to "receptor = anchor (AGO1) vs. ligand = every other chain".
plip:
  dnareceptor: false
  fix_pdb: false
  chains: "[['A'], ['B']]"
  docker_memory: "8g"
  docker_platform: "linux/amd64"
