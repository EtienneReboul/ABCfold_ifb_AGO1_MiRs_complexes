# ─────────────────────────────────────────────
# Complex spec — AGO1 x ATG8A binary complex (protein-protein only, no miR)
# AGO1 sequence copied verbatim from configs/ago1_fbw2.yaml (itself from the
# sibling esther_project's AF3-webserver job_request.json files).
# AGO1  = ARGONAUTE 1 (Arabidopsis thaliana).
# ATG8A = Autophagy-related protein 8A (Arabidopsis thaliana),
#         UniProt Q8LEM4 (ATG8A_ARATH), locus AT4G21980.2 — ubiquitin-like
#         autophagy modifier.
# ─────────────────────────────────────────────

name: ago1_atg8a

sequences:
  - type: protein
    id: A
    name: AGO1
    sequence: ""
  - type: protein
    id: B
    name: ATG8A
    sequence: "MIFACLKFAETNRIAMAKSSFKISNPLEARMSESSRIREKYPDRIPVIVEKAGQSDVPDIDKKKYLVPADLTVGQFVYVVRKRIKLGAEKAIFVFVKNTLPPTAALMSAIYEEHKDEDGFLYMTYSGENTFGSLTVA"

# Rigid structural anchor for pose clustering: AGO1 (the receptor).
anchor_chain: A
partner_chains: [B]        # ATG8A

# ── PLIP (Stage 3, postprocessing) — AGO1-anchored, receptor = AGO1 vs rest ──
# "receptor = anchor (AGO1) vs. ligand = every other chain", same view as ago1_fbw2.
plip:
  dnareceptor: false
  fix_pdb: false
  chains: "[['A'], ['B']]"
  docker_memory: "8g"
  docker_platform: "linux/amd64"
