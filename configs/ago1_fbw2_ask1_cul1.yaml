# ─────────────────────────────────────────────
# Complex spec — AGO1 x FBW2 x ASK1 x CUL1 complex (SCF-context, no miR)
# Sequences copied verbatim from the sibling esther_project's AF3-webserver
# job_request.json files (../../esther_project/data/AGO1_FBW2_ASK1_CUL1/.../*_job_request.json).
# AGO1 = ARGONAUTE 1 (Arabidopsis thaliana), FBW2 = F-box/WD40 protein FBW2.
# ASK1 = SKP1-like (ARABIDOPSIS SKP1 HOMOLOG 1), CUL1 = CULLIN 1.
# ~2265 residues total — near the DRB2 project's RNA-complex size where
# Chai-1 (2048-token) / Protenix (2560-token) hard caps and Boltz OOM
# started biting; if only AF3/OpenFold3/RosettaFold3 produce structures
# here that's the same architectural-limit story, not a pipeline bug.
# ─────────────────────────────────────────────

name: ago1_fbw2_ask1_cul1

sequences:
  - type: protein
    id: A
    name: AGO1
    sequence: ""
  - type: protein
    id: B
    name: FBW2
    sequence: ""
  - type: protein
    id: C
    name: ASK1
    sequence: "MSAKKIVLKSSDGESFEVEEAVALESQTIAHMVEDDCVDNGVPLPNVTSKILAKVIEYCKRHVEAAASKAEAVEGAATSDDDLKAWDADFMKIDQATLFELILAANYLNIKNLLDLTCQTVADMIKGKTPEEIRTTFNIKNDFTPEEEEEVRRENQWAFE"
  - type: protein
    id: D
    name: CUL1
    sequence: ""

anchor_chain: A
partner_chains: [B, C, D]  # FBW2, ASK1, CUL1

# ── PLIP (Stage 3, postprocessing) — AGO1-anchored, receptor = AGO1 vs rest ──
# Mirrors esther_project/configs/AGO1_FBW2_interactions.yaml's receptor=A view,
# generalised to "receptor = anchor (AGO1) vs. ligand = every other chain".
plip:
  dnareceptor: false
  fix_pdb: false
  chains: "[['A'], ['B', 'C', 'D']]"
  docker_memory: "8g"
  docker_platform: "linux/amd64"
