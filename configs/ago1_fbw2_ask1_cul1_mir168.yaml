# ─────────────────────────────────────────────
# Complex spec — AGO1 x FBW2 x ASK1 x CUL1 x miR168 complex (full SCF + miR)
# Sequences copied verbatim from the sibling esther_project's AF3-webserver
# job_request.json files (../../esther_project/data/AGO1_FBW2_ASK1_CUL1_miR168/.../*_job_request.json).
# AGO1 = ARGONAUTE 1 (Arabidopsis thaliana), FBW2 = F-box/WD40 protein FBW2.
# ASK1 = SKP1-like, CUL1 = CULLIN 1. ~2286 residues + 21 nt — the largest
# job here; expect the same Chai-1/Protenix/Boltz size limits as noted in
# configs/ago1_fbw2_ask1_cul1.yaml.
# ─────────────────────────────────────────────

name: ago1_fbw2_ask1_cul1_mir168

sequences:
  - type: protein
    id: A
    name: AGO1
    sequence: ""
  - type: protein
    id: B
    name: FBW2
    sequence: ""
  - type: protein
    id: C
    name: ASK1
    sequence: "MSAKKIVLKSSDGESFEVEEAVALESQTIAHMVEDDCVDNGVPLPNVTSKILAKVIEYCKRHVEAAASKAEAVEGAATSDDDLKAWDADFMKIDQATLFELILAANYLNIKNLLDLTCQTVADMIKGKTPEEIRTTFNIKNDFTPEEEEEVRRENQWAFE"
  - type: protein
    id: D
    name: CUL1
    sequence: ""
  - type: rna
    id: E
    name: miR168
    sequence: "UCGCUUGGUGCAGGUCGGGAA"

# RNA (chain E) excluded from the pose-clustering feature vector — see the miR
# complexes' configs for rationale.
anchor_chain: A
partner_chains: [B, C, D]  # FBW2, ASK1, CUL1 (RNA excluded)

# ── PLIP (Stage 3, postprocessing) — AGO1-anchored, receptor = AGO1 vs rest ──
# Mirrors esther_project/configs/AGO1_FBW2_interactions.yaml's receptor=A view,
# generalised to "receptor = anchor (AGO1) vs. ligand = every other chain".
plip:
  dnareceptor: true
  fix_pdb: true
  chains: "[['A'], ['B', 'C', 'D', 'E']]"
  docker_memory: "8g"
  docker_platform: "linux/amd64"

# ── PLIP: miR-ligand pass (Stage 3f/g/h-alt) ─────────────────────────────────
# Direct port of esther_project/configs/mir_ligands.yaml. The main plip: block
# above folds the miR RNA into the receptor group alongside AGO1 (+ ASK1/CUL1),
# so per-nucleotide miR contacts are invisible to it. This second pass omits
# --chains entirely (PLIP segfaults if an RNA chain group is listed first) and
# runs WITHOUT --dnareceptor, so every miR nucleotide is reported as its own
# SMALLMOLECULE ligand and all positions surface; downstream analysis filters
# to chain A (AGO1) as needed.
plip_mir_ligands:
  dnareceptor: false
  fix_pdb: true          # ABCfold's RNA atom naming still needs canonicalising
  chains: null            # omit --chains entirely
  docker_memory: "8g"
  docker_platform: "linux/amd64"
