# =============================================================================
# ABCfold IFB AGO1 / FBW2 / miR Complex Pipeline — Master Configuration
# =============================================================================
# Sibling of ../../drb2_modelling/ABCfold_ifb_drbs_dcl4_ds_rna_complexes and a
# rebuild of ../../esther_project (which predicted AGO1/FBW2/miR complexes by
# hand-submitting AF3-webserver replicas and running a PLIP-only Snakefile —
# no ABCfold, no pose clustering). Same protocol as the DRB2 pipeline:
# ABCfold (https://github.com/rigdenlab/ABCFold) launches AlphaFold3, Boltz-2,
# Chai-1, OpenFold3, Protenix and RosettaFold3 TOGETHER per complex on the IFB
# cluster, one fold_input.json with every seed in modelSeeds, MSA/templates
# resolved once locally so compute nodes need no internet.
#
# Covers all stages:
#   1. Fold input     — fold_input.resolved.json per complex
#                        (configs/<complex>.yaml + this file's af3/mmseqs2 blocks)
#   2. ABCfold run     — 6 backends together on the IFB cluster (SLURM)
#   3. Postprocessing  — compress raw confidence sprawl, AGO1-anchored pose
#                        clustering, top-N/cluster selection, minimize,
#                        fix_pdb, PLIP (AGO1-anchored + miR-ligand passes),
#                        aggregate

# ── Complexes to run ──────────────────────────────────────────────────────────
# One configs/<name>.yaml per entry. All six come from esther_project's data/
# tree. AGO1 = ARGONAUTE 1 (A. thaliana), FBW2 = F-box/WD40 protein FBW2,
# ASK1 = SKP1-like, CUL1 = CULLIN 1.
complexes:
  - ago1_fbw2                       # AGO1 + FBW2 (binary, no miR)
  - ago1_atg8a                      # AGO1 + ATG8A (binary, no miR) — UniProt Q8LEM4 / AT4G21980.2
  - ago1_atg8a_mir168             # AGO1 + ATG8A + miR168 (21 nt) — ATG8A ternary w/ miR
  - ago1_fbw2_mir165a              # + miR165a (21 nt)
  - ago1_fbw2_mir168               # + miR168  (21 nt)
  - ago1_fbw2_mir393a              # + miR393a (22 nt)
  - ago1_fbw2_ask1_cul1            # + ASK1 + CUL1 (SCF context, no miR) — ~2265 aa
  - ago1_fbw2_ask1_cul1_mir168     # + ASK1 + CUL1 + miR168 — largest job here

# ── Stage 1a: fold_input.json (AlphaFold3-dialect, consumed by ABCfold) ──────
af3:
  dialect: "alphafold3"       # fold_input.json JSON dialect (ABCfold expects this key name)
  json_version: 1

  n_replicas: 20               # j — independent seeds per complex
  seed_strategy: "sequential"  # "sequential" | "random"
  seed_base: 1
  random_master_seed: 0        # only used when seed_strategy: random

# ── Stage 1b: MMseqs2 "default run" — MSA + templates from the ColabFold ────
# webserver, no curated/synthetic template override, no pocket constraint.
# Wraps ABCfold's own `mmseqs2msa` CLI. Run once per complex.
mmseqs2:
  num_templates: 20            # ABCfold default; passed to mmseqs2msa --num_templates
  delay: 8                     # seconds between per-complex webserver calls (politeness)
  retries: 3                   # outer retry loop around each mmseqs2msa call

# ── Stage 2: ABCfold run ──────────────────────────────────────────────────────
# Model letters map 1:1 onto ABCfold's CLI flags (-a/-b/-c/-o/-p/-r); see
# worflows/processing/submit_abcfold.sh. Every model below is run TOGETHER in
# one `abcfold` invocation per complex.
#
# NOTE (carried over from the DRB2 pipeline's experience): the two ASK1/CUL1
# complexes are ~2265–2286 residues. At that size Chai-1 (hard 2048-token cap)
# and Protenix (hard 2560-token cap) may fail while `abcfold` still exits 0 —
# check per-backend CIF counts after the run, don't trust the SLURM COMPLETED
# state alone. The 4 AGO1/FBW2(+miR) complexes are ~1367–1389 residues and
# should clear every remaining backend's limit. (Boltz is disabled — see below.)
# Boltz (-b): was broken 2026-09-08, FIXED same day. `abcfold`'s
# ensure_boltz_env installs `cuequivariance_ops_torch-cu12` unpinned and
# resolved it to 0.11.0, which needs torch>=2.11 while the env has torch 2.7.0
# — so the Triton kernels failed to import (`cannot import name
# is_fx_symbolic_tracing from torch.fx._symbolic_trace`) and Boltz produced
# nothing. Fix: pinned the cuequivariance trio to 0.10.0 (torch>=2.4) in the
# abcfold-boltz-py311 env, and patched abcfold/boltz/check_install.py to
# install `cuequivariance*<0.11` so a future env rebuild stays good
# (both on IFB; backups `.bak-cueq-pin` / boltz_env_backup_*).
# Verified on an idle H200 (143 GB) with abcfold's exact flags: ago1_fbw2
# (1367 res) peak 135 GB / 5 CIFs, ago1_fbw2_mir168 (1389 res) peak 139 GB /
# 5 CIFs, 0 failed examples.
#
# Headroom is thin: it fits the 4 small complexes (~1367–1389 res) on the
# H200 but the 2 ASK1/CUL1 complexes (~2265 res) will still OOM — Boltz for
# those is a genuine size limit, expect 4/6 backends there (as before).
abcfold:
  models:
    alphafold3: true          # -a
    boltz: true                # -b  — works on the 4 small complexes; OOMs the 2 ASK1/CUL1 ones (H200 143 GB)
    chai1: true                 # -c
    openfold3: true             # -o
    protenix: true               # -p
    rosettafold3: true            # -r

  model_params: "/shared/bank/alphafold3/current"   # AF3 weights dir
  af3_module_version: "3.0.2"   # version component of IFB's alphafold module/wrapper path
  af3_sif_path: ""              # override only — empty = auto-discover (submit_abcfold.sh)

  number_of_models: 5           # ABCfold's number_of_models (AF3 --num_diffusion_samples-equivalent)
  num_recycles: 10              # AF3 recycles (ignored by OpenFold3 — see ABCfold README)

# ── Stage 3a: pose clustering (AGO1-anchor Kabsch + hierarchical RMSD) ───────
cluster:
  n_iter: 8                   # rigid-core refinement iterations
  core_rmsf_target: 1.5       # Angstrom — stop refining once median core RMSF is below this
  min_core_frac: 0.4          # stop refining once the core would drop below this fraction
                               # of the anchor chain's residue count. AGO1 is ~1050 aa with
                               # a Gly-rich disordered N-terminal ~180 aa; 0.4 keeps the
                               # folded PAZ/MID/PIWI lobe as the alignment reference.
  partner_rmsf_target: 5.0    # Angstrom — partner-chain Ca above this RMSF (after anchor-frame
                               # alignment) are dropped from the clustering feature vector.
  partner_min_frac: 0.4       # floor on kept partner Ca as a fraction of partner chain(s)'
                               # total length
  max_k: 12                   # max clusters tried when silhouette-selecting k

# ── Stage 3b: top-N-per-cluster selection ─────────────────────────────────────
selection:
  top_n: 100000                # effectively "all" — .head(top_n) caps at the cluster's
                               # actual size, so this stages every pose-clustered model
                               # for minimize/fix_pdb/PLIP
  rank_by: "ranking_score"    # backend's own ranking score (see abcfold_backends.py);
                               # falls back to iptm for any row missing one

# ── Output directories ────────────────────────────────────────────────────────
dirs:
  fold_inputs: "data/fold_inputs"     # generated fold_input.json per complex
  abcfold_out: "results/abcfold"      # ABCfold outputs (raw predictions, all 6 backends)
  metadata:    "results/metadata"     # compressed per-model confidence metadata (parquet + h5)
  postproc:    "results"              # per-complex postprocessing results at results/<complex>/
  logs:        "logs"

# ── PLIP / ChimeraX (Stage 3d-3h) ────────────────────────────────────────────
# Per-complex overrides (dnareceptor, fix_pdb, chains, docker settings) live in
# configs/<complex>.yaml's plip: and plip_mir_ligands: blocks. Host-specific:
chimerax_bin: "/Applications/ChimeraX-1.12.app/Contents/MacOS/ChimeraX"
plip_image: "docker.io/pharmai/plip:latest"
